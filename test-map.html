<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Map Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        #map {
            width: 100%;
            height: 500px;
            border: 2px solid #333;
            margin-top: 20px;
        }
        .log {
            background-color: white;
            padding: 15px;
            margin: 10px 0;
            border-left: 4px solid #2196F3;
            font-family: monospace;
            font-size: 12px;
        }
        .error {
            border-left-color: #f44336;
            color: #f44336;
        }
        .success {
            border-left-color: #4CAF50;
            color: #4CAF50;
        }
        h1 {
            color: #333;
        }
    </style>
</head>
<body>
    <h1>Google Map Diagnostic Test</h1>
    <div id="logs"></div>
    <div id="map"></div>

    <script>
        function log(message, type = 'info') {
            const logsDiv = document.getElementById('logs');
            const logEntry = document.createElement('div');
            logEntry.className = 'log ' + type;
            logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logsDiv.appendChild(logEntry);
            console.log(message);
        }

        log('Page loaded and script initialized');
        
        const HYDERABAD_CENTER = { lat: 17.3850, lng: 78.4867 };
        let map;

        function initMap() {
            log('initMap() called by Google Maps API', 'success');
            
            const mapElement = document.getElementById('map');
            if (!mapElement) {
                log('ERROR: Map element not found!', 'error');
                return;
            }
            log('Map element found, initializing Google Map...', 'success');

            try {
                map = new google.maps.Map(mapElement, {
                    center: HYDERABAD_CENTER,
                    zoom: 11,
                    mapTypeId: 'roadmap'
                });
                log('Google Map initialized successfully!', 'success');
                
                // Add a test marker
                const marker = new google.maps.Marker({
                    position: HYDERABAD_CENTER,
                    map: map,
                    title: 'Hyderabad Center'
                });
                log('Test marker added to map', 'success');
            } catch (error) {
                log(`ERROR initializing map: ${error.message}`, 'error');
            }
        }

        // Check if Google Maps API is available
        if (typeof google === 'undefined') {
            log('Google Maps API not loaded yet...', 'info');
        } else if (typeof google.maps === 'undefined') {
            log('Google Maps library not ready yet...', 'info');
        } else {
            log('Google Maps API is available', 'success');
            initMap();
        }

        // Make initMap globally accessible
        window.initMap = initMap;
        log('initMap function exposed to global scope', 'success');
    </script>

    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCiM11oIWXLskaGLvAd2GMmuZ_eVYhB410&libraries=geometry,places&callback=initMap"></script>
</body>
</html>
