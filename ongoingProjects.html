<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Projects - Hyderabad</title>
    <link rel="stylesheet" href="style.css">
    
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCiM11oIWXLskaGLvAd2GMmuZ_eVYhB410&libraries=geometry,places&callback=initMap"></script>
</head>
<body class="bg-home">
    <div id="header-placeholder"></div>

    <main>
        

        <div id="content-container">
            <section id="project-selection">
                <h2>Select a Project:</h2>
                <select id="project-dropdown">
                    <option value="">-- Select Project --</option>
                    </select>
            </section>

            <section id="project-details" style="display: none;">
                <h2><span id="project-name"></span></h2>
                <div class="project-info">
                    <div class="project-images-container">
                        <div class="project-images" id="project-images">
                        </div>
                        <button class="prev-btn">&lt;</button>
                        <button class="next-btn">&gt;</button>
                    </div>
                    <div class="project-keypoints">
                        <h3>Key Points:</h3>
                        <ul id="project-keypoints-list">
                            </ul>
                        <h3>Famous Landmark Routes:</h3>
                        <div id="landmark-routes-container"></div>
                        <br>
                        <h3>Sites:</h3>
                        <ul id="site-list"> </ul>
                    </div>
                </div>
                
            </section>

            <section id="site-details" style="display: none;">
                <h2><span id="site-name"></span></h2>
                <div id="site-source-msg" style="font-size:12px;color:#555;margin-top:4px;"></div>
                <div class="site-layout-wrapper">
                    <div id="site-layout-canvas">
                    </div>
                    <!-- Removed right-side plot details; using centered modal popup instead -->
                </div>
                <!-- Modal overlay for plot details (hidden by default) -->
                <div id="modal-overlay" class="hidden" aria-hidden="true">
                    <div id="plot-modal" role="dialog" aria-modal="true" aria-labelledby="modal-plot-name">
                        <h3 id="modal-plot-name">Plot Details</h3>
                        <div id="modal-plot-content">
                            <p><strong>Area:</strong> <span id="modal-plot-area"></span></p>
                            <p><strong>Direction:</strong> <span id="modal-plot-direction"></span></p>
                            <p><strong>Key Features:</strong> <span id="modal-plot-keyfeatures"></span></p>
                            <p><strong>Status:</strong> <span id="modal-plot-status"></span></p>
                        </div>
                        <div style="width:100%;display:flex;justify-content:center;margin-top:12px;">
                            <button id="modal-close-btn" class="btn ">Close</button>
                        </div>
                    </div>
                </div>
            </section>
        </div>
        <div id="map-container">
            <div id="map"></div>
            <div id="map-overlay">
                </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script>
        fetch('header.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('header-placeholder').innerHTML = html;
                if (window.initHeaderInteractions) window.initHeaderInteractions();
            });

        fetch('footer.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('footer-placeholder').innerHTML = html;
            });
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
