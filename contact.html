<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Balaji Sai Lotus Farm</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-image: url('img/background_contact.jpg');
        }
    </style>
</head>
<body class="bg-home">
    <div id="header-placeholder"></div>

    <main class="flex flex-col flex-grow">
        <!-- Other sections like map-container, project-details, site-details, etc. would go here -->
        <!-- For brevity, only the requested sections are detailed below -->

        <!-- Contact Us and Schedule Appointment Section -->
        <section class="max-w-screen-xl mx-auto my-8 p-5 bg-white bg-opacity-90 rounded-lg shadow-lg flex flex-col md:flex-row gap-8">

            <!-- Left Column: Contact Us Details -->
            <div id="contact-info-column" class="flex-1 p-4 border border-gray-200 rounded-lg bg-white shadow-sm">
                <h1 class="text-center  text-3xl font-bold mb-6">Contact Us</h1>
                <div class="contact-item mb-4">
                    <strong class="text-amber-950 text-lg">Address:</strong>
                    <p class="text-gray-700 text-base">123 Main Street, City, Country</p>
                </div>
                <div class="contact-item mb-4">
                    <strong class="text-amber-950 text-lg">Phone:</strong>
                    <p class="text-gray-700 text-base">+1 234 567 8900</p>
                </div>
                <div class="contact-item mb-4">
                    <strong class="text-amber-950 text-lg">Email:</strong>
                    <p class="text-gray-700 text-base">info@company.com</p>
                </div>
                <div class="contact-item">
                    <strong class="text-amber-950 text-lg">Business Hours:</strong>
                    <p class="text-gray-700 text-base">Mon-Fri: 9:00 AM - 5:00 PM</p>
                    <p class="text-gray-700 text-base">Sat-Sun: Closed</p>
                </div>
            </div>

            <!-- Right Column: Schedule an Appointment Form -->
            <div id="appointment-form-column" class="flex-1 p-4 border border-gray-200 rounded-lg bg-white shadow-sm">
                <h1 class="text-center text-3xl font-bold mb-6">Schedule an Appointment</h1>
                <form id="appointment-form" class="space-y-4">
                    <div>
                        <label for="appointment-date" class="block text-gray-700 text-sm font-semibold mb-1">Date:</label>
                        <input type="date" id="appointment-date" name="appointment-date" class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-500" required>
                    </div>
                    <div>
                        <label for="appointment-time" class="block text-gray-700 text-sm font-semibold mb-1">Time:</label>
                        <!-- Changed to a select dropdown for time -->
                        <select id="appointment-time" name="appointment-time" class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-500" required>
                            <option value="">Select a time</option>
                            <option value="09:00 AM">09:00 AM</option>
                            <option value="09:30 AM">09:30 AM</option>
                            <option value="10:00 AM">10:00 AM</option>
                            <option value="10:30 AM">10:30 AM</option>
                            <option value="11:00 AM">11:00 AM</option>
                            <option value="11:30 AM">11:30 AM</option>
                            <option value="12:00 PM">12:00 PM</option>
                            <option value="12:30 PM">12:30 PM</option>
                            <option value="01:00 PM">01:00 PM</option>
                            <option value="01:30 PM">01:30 PM</option>
                            <option value="02:00 PM">02:00 PM</option>
                            <option value="02:30 PM">02:30 PM</option>
                            <option value="03:00 PM">03:00 PM</option>
                            <option value="03:30 PM">03:30 PM</option>
                            <option value="04:00 PM">04:00 PM</option>
                            <option value="04:30 PM">04:30 PM</option>
                            <option value="05:00 PM">05:00 PM</option>
                        </select>
                    </div>
                    <div>
                        <label for="appointment-type" class="block text-gray-700 text-sm font-semibold mb-1">Appointment Type:</label>
                        <select id="appointment-type" name="appointment-type" class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-500" required>
                            <option value="">Select type</option>
                            <option value="In Person">In Person</option>
                            <option value="Phone Call">Phone Call</option>
                        </select>
                    </div>
                    <div>
                        <label for="full-name" class="block text-gray-700 text-sm font-semibold mb-1">Full Name:</label>
                        <input type="text" id="full-name" name="full-name" placeholder="John Doe" class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-500" required>
                    </div>
                    <div>
                        <label for="phone-number" class="block text-gray-700 text-sm font-semibold mb-1">Phone Number:</label>
                        <input type="tel" id="phone-number" name="phone-number" placeholder="123-456-7890" class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-500">
                    </div>
                    <div>
                        <label for="email-id" class="block text-gray-700 text-sm font-semibold mb-1">Email ID (optional):</label>
                        <input type="email" id="email-id" name="email-id" placeholder="john.doe@example.com" class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-500">
                    </div>
                    <!-- Updated button with blue background and hover effect -->
                    <button type="submit" class="bg-blue-600 text-white font-bold px-6 py-3 rounded-full shadow-md transition-all duration-300 ease-in-out hover:bg-blue-700 hover:scale-105 w-full">Schedule Appointment</button>
                </form>
            </div>
        </section>   

        
    </main>

    <!-- Modal overlay for showing appointment results (reuses plot modal styles) -->
    <div id="modal-overlay" class="hidden" aria-hidden="true">
        <div id="plot-modal" role="dialog" aria-modal="true" aria-labelledby="modal-plot-name">
            <h3 id="modal-plot-name">Appointment</h3>
            <div id="modal-plot-content">
                <p id="modal-plot-message"></p>
            </div>
            <div style="width:100%;display:flex;justify-content:center;margin-top:12px;">
                <button id="modal-close-btn" class="btn">Close</button>
            </div>
        </div>
    </div>

    <script>
        // Replace with your deployed Google Apps Script Web App URL (see GAS/README.md)
        // Example: https://script.google.com/macros/s/AKfycbx.../exec
        const API_ENDPOINT = 'https://script.google.com/macros/s/AKfycbxc8FbH-FXN4VvF4PUYOyVZCX103OAykzVRsQAjmeOdT8XYjuZHvIfHniFVlOvaAglB/exec';
        // Optional: set an API_KEY if you configure one in the Apps Script (recommended for some protection)
        const API_KEY = '';

        // Get form elements
        const appointmentForm = document.getElementById('appointment-form');

        // Modal elements (reusing plot modal markup & styles)
        const modalOverlay = document.getElementById('modal-overlay');
        const modalTitleEl = document.getElementById('modal-plot-name');
        const modalMessageEl = document.getElementById('modal-plot-message');
        const modalCloseBtn = document.getElementById('modal-close-btn');

        // Function to show modal with title and HTML content
        function showModal(title, htmlContent) {
            modalTitleEl.textContent = title;
            modalMessageEl.innerHTML = htmlContent;
            modalOverlay.classList.remove('hidden');
        }

        // Event listener for closing the modal
        modalCloseBtn.addEventListener('click', () => {
            modalOverlay.classList.add('hidden');
        });

        // Also close modal when clicking outside the modal content
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) modalOverlay.classList.add('hidden');
        });

        // Handle form submission
        appointmentForm.addEventListener('submit', async function(event) {
            event.preventDefault(); // Prevent default form submission (page reload)

            // Get form values
            const date = document.getElementById('appointment-date').value;
            const time = document.getElementById('appointment-time').value;
            const appointmentType = document.getElementById('appointment-type').value;
            const name = document.getElementById('full-name').value.trim();
            const phone = document.getElementById('phone-number').value.trim();
            const email = document.getElementById('email-id').value.trim();

            // Basic validation (note: email is optional)
            if (!date || !time || !appointmentType || !name) {
                showModal('Error', 'Please fill in all required fields (date, time, appointment type, name).');
                return;
            }

            // Create new appointment object
            const payload = {
                date,
                time,
                appointmentType,
                name,
                phone,
                email
            };

            if (API_KEY) payload.apiKey = API_KEY; // include apiKey if configured

            try {
                // Use FormData to avoid triggering a CORS preflight (Apps Script may reject OPTIONS preflight)
                const formData = new FormData();
                formData.append('date', date);
                formData.append('time', time);
                formData.append('appointmentType', appointmentType);
                formData.append('name', name);
                formData.append('phone', phone);
                formData.append('email', email ? email : "none");
                if (API_KEY) formData.append('apiKey', API_KEY);

                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    body: formData,
                });

                let respJson = {status: 'error', message: 'Unknown error'};
                try { respJson = await response.json(); } catch (e) { /* ignore parse error */ }

                if (response.ok && respJson.status === 'success') {
                    // Show modal with appointment details
                    const summaryHtml = `
                        <p><strong>Appointment scheduled successfully.</strong></p>
                        <p><strong>Date:</strong> ${date}</p>
                        <p><strong>Time:</strong> ${time}</p>
                        <p><strong>Type:</strong> ${appointmentType}</p>
                        <p><strong>Name:</strong> ${name}</p>
                        ${phone ? `<p><strong>Phone:</strong> ${phone}</p>` : ''}
                        ${email ? `<p><strong>Email:</strong> ${email}</p>` : '<p><em>No email provided</em></p>'}
                    `;
                    showModal('Appointment Scheduled', summaryHtml);
                    appointmentForm.reset(); // Clear the form
                } else {
                    showModal('Error', `Failed to schedule appointment: ${respJson.message || response.statusText}`);
                }
            } catch (error) {
                console.error('Network or server error:', error);
                showModal('Error', 'Could not connect to the server. Please check the web app URL, deployment access, and the browser console for CORS/preflight errors.');
            }
        });
    </script>
    <script>
        fetch('header.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('header-placeholder').innerHTML = html;
                if (window.initHeaderInteractions) window.initHeaderInteractions();
            });

        fetch('footer.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('footer-placeholder').innerHTML = html;
            });
    </script>
    <script src="script.js"></script>
</body>
</html>
